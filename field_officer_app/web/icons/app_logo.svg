<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Inner Land Parcel Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Cadastral Coordinate Grid Lines (Background) -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-opacity="0.06"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke="#38BDF8" stroke-opacity="0.04"/>
  </g>

  <!-- Main Emblem Container with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Outer Defense / Land Shield -->
    <path d="M 256 84 
             C 334 108, 386 114, 404 126
             C 404 260, 350 370, 256 424
             C 162 370, 108 260, 108 126
             C 126 114, 178 108, 256 84 Z"
          fill="url(#shieldGrad)"
          stroke="#93C5FD"
          stroke-width="4"
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset Dark Surface -->
    <path d="M 256 106 
             C 324 127, 368 132, 382 142
             C 382 250, 336 344, 256 392
             C 176 344, 130 250, 130 142
             C 144 132, 188 127, 256 106 Z"
          fill="#0B132B"
          opacity="0.9"/>

    <!-- Geometric Cadastral Land Parcel Shapes Inside -->
    <!-- Top-Left Parcel (Forest/Poramboke) -->
    <path d="M 160 180 L 246 160 L 246 246 L 160 220 Z" 
          fill="url(#landGrad)" 
          opacity="0.9"
          stroke="#059669" 
          stroke-width="2"/>

    <!-- Top-Right Parcel (Waterbody/Survey) -->
    <path d="M 266 160 L 352 180 L 336 260 L 266 246 Z" 
          fill="#0284C7" 
          opacity="0.85"
          stroke="#38BDF8" 
          stroke-width="2"/>

    <!-- Bottom-Left Parcel -->
    <path d="M 160 236 L 246 260 L 246 340 L 190 310 Z" 
          fill="#3B82F6" 
          opacity="0.8"
          stroke="#60A5FA" 
          stroke-width="2"/>

    <!-- Bottom-Right Parcel (Active Surveillance Area) -->
    <path d="M 266 260 L 336 274 L 310 336 L 266 340 Z" 
          fill="url(#goldGrad)" 
          opacity="0.85"
          stroke="#FCD34D" 
          stroke-width="2"/>

    <!-- Central Target Radar Node & Crosshair -->
    <g filter="url(#glow)">
      <!-- Radar Rings -->
      <circle cx="256" cy="253" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>
      <circle cx="256" cy="253" r="22" fill="#FFFFFF" fill-opacity="0.15" stroke="#38BDF8" stroke-width="3"/>
      
      <!-- Crosshairs -->
      <line x1="256" y1="195" x2="256" y2="225" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="256" y1="281" x2="256" y2="311" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="198" y1="253" x2="228" y2="253" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="284" y1="253" x2="314" y2="253" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Center GPS Core Beacon -->
      <circle cx="256" cy="253" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>

    <!-- Satellite Orbit Sweep Arc -->
    <path d="M 145 160 A 180 140 30 0 1 370 340" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8,6" opacity="0.7"/>
    <!-- Satellite Icon Top Right -->
    <g transform="translate(365, 145) rotate(45)">
      <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#FFFFFF"/>
      <line x1="-16" y1="0" x2="-8" y2="0" stroke="#38BDF8" stroke-width="3"/>
      <rect x="-24" y="-7" width="8" height="14" rx="1" fill="#38BDF8"/>
      <line x1="8" y1="0" x2="16" y2="0" stroke="#38BDF8" stroke-width="3"/>
      <rect x="16" y="-7" width="8" height="14" rx="1" fill="#38BDF8"/>
    </g>
  </g>
</svg>
