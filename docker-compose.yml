services:
  db:
    image: postgis/postgis:15-3.3
    container_name: land_db
    environment:
      POSTGRES_USER: landuser
      POSTGRES_PASSWORD: landpassword
      POSTGRES_DB: land_records
    ports:
      - "5435:5432"
    volumes:
      - land_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landuser -d land_records"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: land_backend
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Isolated backend for Playwright. Own database (land_records_e2e), own port, started only with
  # `--profile e2e`. Same image as `backend`; never shares data with land_records.
  backend_e2e:
    image: land-project-backend:latest
    container_name: land_backend_e2e
    profiles: ["e2e"]
    env_file:
      - .env.docker
    environment:
      DB_NAME: land_records_e2e
      GEOMMAND_ENV: demo
      TEST_LOGIN_THROTTLE_RATE: 1000/minute
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  geoserver:
    image: docker.osgeo.org/geoserver:2.24.1
    container_name: land_geoserver
    ports:
      - "8081:8080"
    environment:
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - INSTALL_EXTENSIONS=true
      - COMMUNITY_EXTENSIONS=gwc-s3-plugin
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on:
      - db

  adminer:
    image: adminer
    container_name: land_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: land_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-landredispass2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-landredispass2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Port not published to host (internal container network only)

  celery_worker:
    image: land-project-backend:latest
    container_name: land_celery_worker
    command: celery -A config worker --loglevel=info
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["scheduler", "full"]

  celery_beat:
    image: land-project-backend:latest
    container_name: land_celery_beat
    command: celery -A config beat --loglevel=info
    env_file:
      - .env.docker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-landredispass2026}@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["scheduler", "full"]

volumes:
  land_db_data:
  geoserver_data:
