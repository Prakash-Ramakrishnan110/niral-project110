name: CI Test Suite

on:
  push:
    branches: [ main, master, production-hardening ]
  pull_request:
    branches: [ main, master, production-hardening ]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: landuser
          POSTGRES_PASSWORD: landpassword
          POSTGRES_DB: land_records
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landuser -d land_records"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: land_records
          DB_USER: landuser
          DB_PASSWORD: landpassword
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-3.15.2
        run: |
          python backend/manage.py migrate

      - name: Run Django Tests (Core Suite)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: land_records
          DB_USER: landuser
          DB_PASSWORD: landpassword
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-3.15.2
        run: |
          python backend/manage.py test core --noinput
